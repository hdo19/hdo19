<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b6cfb"><title>إدارة حدور تك</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head><body class="admin-page"><header class="site-header"><div class="container nav-wrap"><a class="brand" href="index.html"><span class="brand-mark">H</span><span><strong>حدور تك</strong><small>ADMIN CENTER</small></span></a><a class="text-link" href="index.html">العودة للموقع ↗</a></div></header><main class="container admin-shell"><section id="loginPanel" class="admin-login"><div class="admin-emblem">H.</div><span class="section-kicker">منطقة خاصة</span><h1>لوحة إدارة حدور تك</h1><p class="muted">سجّل الدخول بحساب Google المصرّح له من مالك الموقع.</p><button class="btn btn-primary" id="googleLogin">الدخول باستخدام Google</button><p id="loginStatus" class="muted" aria-live="polite"></p></section>
<section id="dashboard" hidden><div class="admin-top"><div><span class="section-kicker">HADOOR TECH CONTROL</span><h1>إدارة المحتوى</h1><p class="muted" id="adminEmail"></p></div><button class="btn btn-ghost" id="logout">تسجيل الخروج</button></div><div class="admin-tabs"><button class="filter-btn active" data-tab="articles">المقالات</button><button class="filter-btn" data-tab="comments">التعليقات</button></div>
<div id="articlesPanel" class="admin-panel"><div class="admin-panel-head"><h2>المقالات المنشورة</h2><div class="admin-row-actions"><button class="btn btn-ghost" id="importStarter">استيراد مقالات البداية</button><button class="btn btn-primary" id="newArticle">＋ شرح جديد</button></div></div><form id="articleForm" class="admin-form admin-editor" hidden><input type="hidden" name="id"><label>عنوان المقال<input name="title" required maxlength="140"></label><label>القسم<select name="category"><option value="windows">ويندوز</option><option value="android">أندرويد</option><option value="kali">لينكس وكالي</option><option value="web">تطوير الويب</option><option value="troubleshoot">حلول المشاكل</option></select></label><label>رابط الصورة<input name="imageUrl" type="url"></label><label>وصف مختصر<textarea name="desc" rows="2" required></textarea></label><label>محتوى المقال<textarea name="articleContent" rows="7" required></textarea></label><label>الكود (اختياري)<textarea name="code" rows="3"></textarea></label><label>اسم لغة الكود<input name="codeLabel" placeholder="CMD / HTML / Terminal"></label><label>ملاحظات إضافية<textarea name="extra" rows="2"></textarea></label><label>رابط فيديو يوتيوب<input name="videoUrl" type="url"></label><label>رابط الملفات<input name="downloadUrl" type="url"></label><div class="admin-form-actions"><button class="btn btn-primary" type="submit">حفظ ونشر</button><button class="btn btn-ghost" type="button" id="cancelEdit">إلغاء</button></div><p id="articleStatus" class="muted"></p></form><div id="adminArticles" class="admin-list"></div></div>
<div id="commentsPanel" class="admin-panel" hidden><div class="admin-panel-head"><h2>مراجعة التعليقات</h2><button class="btn btn-ghost" id="refreshComments">تحديث</button></div><div id="adminComments" class="admin-list"></div></div></section></main><script type="module" src="admin.js"></script></body></html>
